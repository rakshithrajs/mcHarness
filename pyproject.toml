[project]
name = "harness"
version = "0.1.0"
description = "harness the power."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "async>=0.6.2",
    "dotenv>=0.9.9",
    "ollama>=0.6.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "tzdata>=2025.2",
]

[project.scripts]
status = "utils.helpers:status"
harness = "main:main"
harness-tui = "ui.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["context", "llm", "security", "skills", "tools", "ui", "utils"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
